[project]
name = "claude-gas-gauge"
version = "0.1.0"
description = "A Claude Code status line that shows what the session costs and writes it to disk for your own tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ivan Schneider" }]
keywords = ["claude-code", "status-line", "cost", "tokens"]
dependencies = []

[project.scripts]
gas-gauge = "gas_gauge:main"

[project.urls]
Repository = "https://github.com/ivantohelpyou/claude-gas-gauge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gas_gauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
